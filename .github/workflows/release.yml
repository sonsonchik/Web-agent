name: Build and Release

on:
  push:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: linux
          - os: macos-latest
            artifact_suffix: macos
          - os: windows-latest
            artifact_suffix: windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DWEB_AGENT_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build --prefix build/install --config Release
          cpack --config build/CPackConfig.cmake -G TGZ -B build/package
          mkdir -p dist
          ls -la build/package
          cp -v build/package/*.tar.gz dist/web-agent-linux-x86_64.tar.gz

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build --prefix build/install --config Release
          cpack --config build/CPackConfig.cmake -G ZIP -B build/package
          mkdir -p dist
          ls -la build/package
          cp -v build/package/*.zip dist/web-agent-macos-universal.zip
          APP_BUNDLE="build/web-agent.app"
          if [ ! -d "$APP_BUNDLE" ]; then
            APP_BUNDLE="build/Release/web-agent.app"
          fi
          if [ ! -d "$APP_BUNDLE" ]; then
            APP_BUNDLE="build/Debug/web-agent.app"
          fi
          test -d "$APP_BUNDLE"
          ditto -c -k --sequesterRsrc --keepParent "$APP_BUNDLE" dist/web-agent-macos.app.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --install build --prefix build/install --config Release
          cpack --config build/CPackConfig.cmake -G ZIP -B build/package
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Get-ChildItem build/package
          Copy-Item build/package/*.zip dist/web-agent-windows-x86_64.zip
          if (Test-Path build/Release/web-agent.exe) {
            Copy-Item build/Release/web-agent.exe dist/web-agent-windows.exe
          } elseif (Test-Path build/web-agent.exe) {
            Copy-Item build/web-agent.exe dist/web-agent-windows.exe
          } else {
            throw \"web-agent.exe was not found\"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-agent-${{ matrix.artifact_suffix }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact folders
        run: |
          mkdir -p release-assets
          find dist -type f -maxdepth 3 -exec cp {} release-assets/ \;

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
