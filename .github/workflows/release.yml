name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-latest
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: web-agent-linux
            archive_name: web-agent-linux-x86_64.tar.gz

          - os: macos-latest
            artifact_name: web-agent-macos
            archive_name: web-agent-macos.zip

          - os: windows-latest
            artifact_name: web-agent-windows
            archive_name: web-agent-windows-x86_64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -DWEB_AGENT_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --parallel

      - name: Run tests
        shell: bash
        run: |
          ctest --test-dir build \
            --build-config Release \
            --output-on-failure

      ####################################################################
      # Linux
      ####################################################################

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/web-agent-linux/config

          cp build/web-agent dist/web-agent-linux/
          cp config/agent_config.yaml dist/web-agent-linux/config/
          cp README.md dist/web-agent-linux/

          tar -C dist -czf dist/web-agent-linux-x86_64.tar.gz web-agent-linux

      ####################################################################
      # macOS
      ####################################################################

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/web-agent-macos/config

          cp build/web-agent dist/web-agent-macos/
          cp config/agent_config.yaml dist/web-agent-macos/config/
          cp README.md dist/web-agent-macos/

          cat > dist/web-agent-macos/run-web-agent.command <<'SH'
          #!/bin/bash

          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          cd "$SCRIPT_DIR"

          chmod +x ./web-agent
          ./web-agent

          echo
          echo "Press Enter to close..."
          read -r _
          SH

          chmod +x dist/web-agent-macos/run-web-agent.command

          ditto -c -k --keepParent \
            dist/web-agent-macos \
            dist/web-agent-macos.zip

      ####################################################################
      # Windows
      ####################################################################

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Path dist/web-agent-windows/config `
            -Force | Out-Null

          if (Test-Path build/Release/web-agent.exe) {
            Copy-Item `
              build/Release/web-agent.exe `
              dist/web-agent-windows/web-agent.exe
          }
          elseif (Test-Path build/web-agent.exe) {
            Copy-Item `
              build/web-agent.exe `
              dist/web-agent-windows/web-agent.exe
          }
          else {
            throw "web-agent.exe was not found"
          }

          Copy-Item `
            config/agent_config.yaml `
            dist/web-agent-windows/config/agent_config.yaml

          Copy-Item `
            README.md `
            dist/web-agent-windows/README.md

          @'
          @echo off
          cd /d "%~dp0"

          web-agent.exe

          echo.
          pause
          '@ | Set-Content dist/web-agent-windows/run-web-agent.bat

          Compress-Archive `
            -Path dist/web-agent-windows/* `
            -DestinationPath dist/web-agent-windows-x86_64.zip `
            -Force

      ####################################################################
      # Upload artifacts
      ####################################################################

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.archive_name }}
          if-no-files-found: error

  ##########################################################################
  # Publish release
  ##########################################################################

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: web-agent-linux
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v5
        with:
          name: web-agent-macos
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: web-agent-windows
          path: release-assets

      - name: Show downloaded files
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f

      - name: Create or update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="latest"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release exists. Removing old assets..."

            for asset in $(gh release view "$TAG_NAME" \
              --json assets \
              --jq '.assets[].name'); do

              gh release delete-asset \
                "$TAG_NAME" \
                "$asset" \
                --yes || true
            done
          else
            echo "Creating release..."

            gh release create "$TAG_NAME" \
              --title "Latest Build" \
              --notes "Automatically generated latest build"
          fi

          echo "Uploading new assets..."

          gh release upload "$TAG_NAME" \
            release-assets/web-agent-linux-x86_64.tar.gz \
            release-assets/web-agent-macos.zip \
            release-assets/web-agent-windows-x86_64.zip \
            --clobber